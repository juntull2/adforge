        - heading "키워드마스터란?" [level=2] [ref=f48e112]
        - generic [ref=f48e113]:
          - heading "키워드마스터 소개" [level=3] [ref=f48e114]
          - paragraph [ref=f48e115]:
            - strong [ref=f48e116]: 키워드마스터
            - text: 는
            - link "웨어이즈포스트" [ref=f48e117] [cursor=pointer]:
              - /url: https://whereispost.com
            - text: 와 함께 운영해온 블로그 키워드 분석 도구입니다. whereispost.com/keyword 에서만 공식적으로 서비스 하고 있으며, 네이버 키워드 검색량(PC/모바일), 블로그 포스트 수, 경쟁도(비율), 블로그 검색 노출 순위를 한 번에 조회할 수 있습니다.
            - link "블로그 관리 솔루션" [ref=f48e118] [cursor=pointer]
          - paragraph [ref=f48e122]:
            - text: 온라인 부업 및 사업에 필수적인 검색량을 빠르게 확인할 수 있고,
            - link "형태소 분석기" [ref=f48e123] [cursor=pointer]:
              - /url: /morpheme
            - text: 로 키워드 빈도수와 감정분석도 가능합니다.
            - link "세부키워드 조합기" [ref=f48e124] [cursor=pointer]:
              - /url: /mix
            - text: 로 롱테일 키워드 생성도 지원합니다.
        - generic [ref=f48e125]:
          - heading "키워드마스터 주요 기능" [level=3] [ref=f48e126]
          - list [ref=f48e127]:
            - listitem [ref=f48e128]:
              - strong [ref=f48e129]: 키워드 검색량 조회
              - text: — 네이버 PC/모바일 월간 검색량을 확인
            - listitem [ref=f48e130]:
              - strong [ref=f48e131]: 블로그 경쟁도 분석
              - text: — 검색량 대비 문서 수 비율로 키워드 난이도 파악
            - listitem [ref=f48e132]:
              - strong [ref=f48e133]: 블로그 노출 순위
              - text: — 네이버(N), 티스토리(T), 다음(D), 기타(E) 블로그 순위 확인
            - listitem [ref=f48e134]:
              - strong [ref=f48e135]: 관련키워드 추천
              - text: — 네이버, 다음, 구글 자동완성 기반 연관 키워드 제공
            - listitem [ref=f48e136]:
              - strong [ref=f48e137]: 엑셀 다운로드
              - text: — 조회 결과를 CSV로 내보내기
        - generic [ref=f48e138]:
          - heading "키워드마스터 사용법" [level=3] [ref=f48e139]
          - insertion [ref=f48e141]:
            - generic [ref=f48e144]:
              - heading "도움말과 관련된 주제 중 관심이 있을 만한 항목입니다." [level=2] [ref=f48e146]: 자세히 알아보기
              - link "비즈니스, 생산성 소프트웨어" [ref=f48e147] [cursor=pointer]
              - link "건축도구 및 공구" [ref=f48e152] [cursor=pointer]
              - link "데이터 관리" [ref=f48e157] [cursor=pointer]
          - paragraph [ref=f48e162]:
            - text: 검색창에 키워드를 입력하면 검색량(최근 30일 기준), 블로그 포스트 수, 경쟁 비율, 블로그 상위 노출 순위가 표시됩니다.
            - link "수학" [ref=f48e163] [cursor=pointer]
          - paragraph [ref=f48e167]: 블로그순위는 해당 키워드가 상단에 노출된 순서로 네이버(N), 티스토리(T), 다음(D), 기타(E)로 구분됩니다.
        - region [ref=f48e168]:
          - heading "검색량과 문서수로 키워드 비교하기" [level=2] [ref=f48e169]
          - paragraph [ref=f48e170]: 키워드마스터는 글을 쓰기 전에 독자의 검색 수요와 이미 발행된 블로그 문서수를 함께 살펴보는 도구입니다. 하나의 수치만으로 주제를 결정하기보다, 같은 주제의 세부 키워드를 여러 개 조회해 비교하는 데 활용해 보세요.
          - heading "결과표의 숫자는 무엇을 뜻하나요?" [level=3] [ref=f48e171]
          - list [ref=f48e172]:
            - listitem [ref=f48e173]:
              - strong [ref=f48e174]: PC·모바일 검색량
              - text: ": 기기별 월간 검색량 지표입니다. 현재 접속자 수나 오늘 하루의 검색 횟수와는 다릅니다."
            - listitem [ref=f48e175]:
              - strong [ref=f48e176]: 총검색량
              - text: ": PC와 모바일 검색량을 더한 값입니다. 실제 블로그 방문자 수나 예상 수익을 뜻하지 않습니다."
            - listitem [ref=f48e177]:
              - strong [ref=f48e178]: 문서수
              - text: ": 해당 키워드로 조회된 블로그 검색 문서수입니다. 월간 검색량과 집계 범위가 다르므로 비교를 위한 참고 지표로 사용하세요."
            - listitem [ref=f48e179]:
              - strong [ref=f48e180]: 비율
              - text: ": 문서수를 총검색량으로 나눈 값입니다. 같은 조건에서는 비율이 낮을수록 검색량에 비해 문서수가 적다는 뜻입니다."
          - heading "비율 계산 예시" [level=3] [ref=f48e181]
          - paragraph [ref=f48e182]:
            - text: 가상의 키워드 A가 PC 검색량 200, 모바일 검색량 800, 문서수 100이라면 총검색량은 1,000이고 비율은
            - strong [ref=f48e183]: 100 ÷ 1,000 = 0.1
            - text: 입니다. 이는 계산 방법을 설명하기 위한 예시이며 실제 조회 결과가 아닙니다. 비율이 0.1이라고 해서 상위 노출 확률이 10%라는 뜻도 아닙니다.
          - heading "주제를 좁혀 비교하는 순서" [level=3] [ref=f48e184]
          - list [ref=f48e185]:
            - listitem [ref=f48e186]: 작성하려는 주제의 기본 키워드를 입력합니다. 예를 들어 ‘캠핑 의자’처럼 독자가 검색할 표현에서 시작합니다.
